[project]
name = "thermalledger-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # Satellite data processing
    "xarray>=2024.2.0",
    "rioxarray>=0.15.0",
    "netCDF4>=1.6.5",
    "rasterio>=1.3.10",
    # Scientific computing
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    # IBM watsonx.ai
    "ibm-watsonx-ai>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100

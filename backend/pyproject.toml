[project]
name = "thermalledger-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "celery[redis]>=5.4.0",
    "kombu>=5.3.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "ibm-watson>=8.1.0",
    "ibm-platform-services>=0.53.0",
    # Data access
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    # Phase 1 — data ingestion
    "requests>=2.32.0",
    "cdsapi>=0.7.0",
    "sqlalchemy>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* to the backend service (strips the /api prefix, matching the
    # same rewrite rule used by the Vite dev-server proxy in vite.config.ts).
    location /api/ {
        proxy_pass        http://backend:8000/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # All other requests served as SPA — fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable logging for health-probe noise.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

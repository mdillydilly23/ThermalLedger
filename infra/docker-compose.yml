services:

  # ── Redis (Celery broker + result backend) ─────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── ML service ─────────────────────────────────────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data:ro          # ADR-002: satellite data bind-mount (read-only)
      - ./shared:/app/shared:ro      # ADR-003: shared EVS schema
      - ./ml/cache:/app/cache:ro     # ADR-006: Granite cache
    env_file: .env
    environment:
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Backend service ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro          # ADR-002: satellite data bind-mount
      - ./shared:/app/shared:ro      # ADR-003: shared EVS schema
    env_file: .env
    environment:
      - ML_SERVICE_URL=http://ml:8001
    depends_on:
      redis:
        condition: service_started
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Celery worker (runs backend tasks) ─────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
      - ./shared:/app/shared:ro
      - ./ml/cache:/app/ml_cache:ro  # Worker reads Granite cache directly
    env_file: .env
    depends_on:
      - redis
      - ml

  # ── Frontend (Vite dev server) ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
